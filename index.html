<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Grande Histoire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Animated Canvas Layer -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Top Controls Bar -->
  <header class="top-nav">
    <div class="nav-left">
      <!-- Mode Switch: 9-Panel Fresco Grid vs Fullscreen Cinematic Film -->
      <div class="view-toggle" title="Basculer entre Fresque 3x3 et Diaporama">
        <button id="mode-grid-btn" class="toggle-btn active">
          <span>▦</span> Grille 9
        </button>
        <button id="mode-slide-btn" class="toggle-btn">
          <span>▶</span> Diaporama
        </button>
      </div>
    </div>

    <!-- Chapter Dots Indicator -->
    <nav class="chapter-dots">
      <button class="dot-btn active" data-page="1" title="Chapitre I : Genèse">
        <span class="dot-num">I</span>
      </button>
      <span class="dot-line"></span>
      <button class="dot-btn locked" data-page="2" title="Chapitre II : Exode (Verrouillé)" disabled>
        <span class="dot-num">II</span>
      </button>
      <span class="dot-line"></span>
      <button class="dot-btn locked" data-page="3" title="Chapitre III : Le Repos (Verrouillé)" disabled>
        <span class="dot-num">III</span>
      </button>
    </nav>

    <div class="nav-right">
      <button id="sound-btn" class="icon-toggle" title="Son Activer / Couper">
        <span id="sound-icon">🔊</span>
      </button>
    </div>
  </header>

  <!-- =========================================================================
       PAGE 1 : GENÈSE (HISTOIRE DÉCOUPÉE EN 9 DESSINS)
       ========================================================================= -->
  <section class="story-page active" id="page-1" data-page="1">
    
    <!-- 3x3 Mosaic Grid (9 Scènes de la Genèse) -->
    <div class="mosaic-grid" id="grid-1">
      <div class="panel-card" data-index="0" title="1. La Création du Monde">
        <img src="images/panels/p1_1.jpg" alt="" loading="lazy">
        <span class="panel-tag">I</span>
      </div>
      <div class="panel-card" data-index="1" title="2. Adam et Ève chassés de l'Éden">
        <img src="images/panels/p1_2.jpg" alt="" loading="lazy">
        <span class="panel-tag">II</span>
      </div>
      <div class="panel-card" data-index="2" title="3. Caïn et Abel">
        <img src="images/panels/p1_3.jpg" alt="" loading="lazy">
        <span class="panel-tag">III</span>
      </div>
      <div class="panel-card" data-index="3" title="4. Le Déluge et l'Arche de Noé">
        <img src="images/panels/p1_4.jpg" alt="" loading="lazy">
        <span class="panel-tag">IV</span>
      </div>
      <div class="panel-card" data-index="4" title="5. La Tour de Babel">
        <img src="images/panels/p1_5.jpg" alt="" loading="lazy">
        <span class="panel-tag">V</span>
      </div>
      <div class="panel-card" data-index="5" title="6. Abraham et l'épreuve de la foi">
        <img src="images/panels/p1_6.jpg" alt="" loading="lazy">
        <span class="panel-tag">VI</span>
      </div>
      <div class="panel-card" data-index="6" title="7. Le combat de Jacob (Israël)">
        <img src="images/panels/p1_7.jpg" alt="" loading="lazy">
        <span class="panel-tag">VII</span>
      </div>
      <div class="panel-card" data-index="7" title="8. Joseph vendu par ses frères">
        <img src="images/panels/p1_8.jpg" alt="" loading="lazy">
        <span class="panel-tag">VIII</span>
      </div>
      <div class="panel-card" data-index="8" title="9. Joseph sauve sa famille en Égypte">
        <img src="images/panels/p1_9.jpg" alt="" loading="lazy">
        <span class="panel-tag">IX</span>
      </div>
    </div>

    <!-- Cinematic Slide View (Enchaînement d'images) -->
    <div class="slideshow-view hidden" id="slideshow-1">
      <div class="slide-viewport">
        <div class="slide-item active" style="background-image: url('images/panels/p1_1.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_2.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_3.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_4.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_5.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_6.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_7.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_8.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p1_9.jpg');"></div>
      </div>
      <!-- Slide navigation controls -->
      <button class="slide-nav-btn prev-btn" onclick="prevSlide(1)">‹</button>
      <button class="slide-nav-btn next-btn" onclick="nextSlide(1)">›</button>
      <div class="slide-bullets" id="bullets-1"></div>
    </div>

    <!-- Secret Password Gate -->
    <div class="floating-gate">
      <form class="gate-form" id="form-gate-1" onsubmit="return false;">
        <span class="lock-glyph">🔒</span>
        <input 
          type="text" 
          id="pass-1" 
          class="gate-input" 
          placeholder="Mot de passe..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button type="submit" class="gate-btn" title="Valider">➜</button>
      </form>
      <div class="gate-status" id="feedback-1"></div>
    </div>
  </section>

  <!-- =========================================================================
       PAGE 2 : EXODE & LÉVITIQUE (HISTOIRE DÉCOUPÉE EN 9 DESSINS)
       ========================================================================= -->
  <section class="story-page" id="page-2" data-page="2">
    
    <!-- 3x3 Mosaic Grid (9 Scènes d'Exode & Lévitique) -->
    <div class="mosaic-grid" id="grid-2">
      <div class="panel-card" data-index="0" title="1. Moïse sur le Nil sous l'esclavage">
        <img src="images/panels/p2_1.jpg" alt="" loading="lazy">
        <span class="panel-tag">I</span>
      </div>
      <div class="panel-card" data-index="1" title="2. Moïse sauvé par la fille de Pharaon">
        <img src="images/panels/p2_2.jpg" alt="" loading="lazy">
        <span class="panel-tag">II</span>
      </div>
      <div class="panel-card" data-index="2" title="3. Moïse et Aaron devant Pharaon">
        <img src="images/panels/p2_3.jpg" alt="" loading="lazy">
        <span class="panel-tag">III</span>
      </div>
      <div class="panel-card" data-index="3" title="4. Les Plaies d'Égypte (Les Ténèbres)">
        <img src="images/panels/p2_4.jpg" alt="" loading="lazy">
        <span class="panel-tag">IV</span>
      </div>
      <div class="panel-card" data-index="4" title="5. La mort des premiers-nés & La Pâque">
        <img src="images/panels/p2_5.jpg" alt="" loading="lazy">
        <span class="panel-tag">V</span>
      </div>
      <div class="panel-card" data-index="5" title="6. Le passage de la Mer Rouge">
        <img src="images/panels/p2_6.jpg" alt="" loading="lazy">
        <span class="panel-tag">VI</span>
      </div>
      <div class="panel-card" data-index="6" title="7. Le don de la Loi au Sinaï">
        <img src="images/panels/p2_7.jpg" alt="" loading="lazy">
        <span class="panel-tag">VII</span>
      </div>
      <div class="panel-card" data-index="7" title="8. Le Veau d'Or et la rupture">
        <img src="images/panels/p2_8.jpg" alt="" loading="lazy">
        <span class="panel-tag">VIII</span>
      </div>
      <div class="panel-card" data-index="8" title="9. Moïse rayonnant & La Sainte Présence">
        <img src="images/panels/p2_9.jpg" alt="" loading="lazy">
        <span class="panel-tag">IX</span>
      </div>
    </div>

    <!-- Cinematic Slide View -->
    <div class="slideshow-view hidden" id="slideshow-2">
      <div class="slide-viewport">
        <div class="slide-item active" style="background-image: url('images/panels/p2_1.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_2.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_3.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_4.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_5.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_6.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_7.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_8.jpg');"></div>
        <div class="slide-item" style="background-image: url('images/panels/p2_9.jpg');"></div>
      </div>
      <button class="slide-nav-btn prev-btn" onclick="prevSlide(2)">‹</button>
      <button class="slide-nav-btn next-btn" onclick="nextSlide(2)">›</button>
      <div class="slide-bullets" id="bullets-2"></div>
    </div>

    <!-- Secret Password Gate -->
    <div class="floating-gate">
      <form class="gate-form" id="form-gate-2" onsubmit="return false;">
        <span class="lock-glyph">🔒</span>
        <input 
          type="text" 
          id="pass-2" 
          class="gate-input" 
          placeholder="Mot de passe..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button type="submit" class="gate-btn" title="Valider">➜</button>
      </form>
      <div class="gate-status" id="feedback-2"></div>
    </div>
  </section>

  <!-- =========================================================================
       PAGE 3 : LA TERRE PROMISE / LE REPOS
       ========================================================================= -->
  <section class="story-page" id="page-3" data-page="3">
    
    <div class="mosaic-grid mosaic-duo" id="grid-3">
      <div class="panel-card" data-index="0" title="Les explorateurs rapportent les fruits de Canaan">
        <img src="images/panels/p3_1.jpg" alt="" loading="lazy">
        <span class="panel-tag">I</span>
      </div>
      <div class="panel-card" data-index="1" title="La traversée du Jourdain vers le Repos">
        <img src="images/panels/p3_2.jpg" alt="" loading="lazy">
        <span class="panel-tag">II</span>
      </div>
    </div>

    <div class="floating-gate">
      <button class="replay-btn" onclick="goToPage(1)">
        <span>⟲ Recommencer</span>
      </button>
    </div>
  </section>

  <!-- Flash Screen Transition -->
  <div class="flash-screen" id="flash-screen"></div>

  <script src="script.js"></script>
</body>
</html>
