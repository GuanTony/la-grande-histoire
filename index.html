<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Grande Histoire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Minimal Audio Control -->
  <button id="sound-btn" class="sound-toggle" title="Activer / Désactiver le son">
    <span id="sound-icon">🔊</span>
  </button>

  <!-- Minimal Chapter Dots Indicator -->
  <nav class="page-dots">
    <button class="dot-btn active" data-page="1" title="Chapitre I">
      <span class="dot-num">I</span>
    </button>
    <span class="dot-line"></span>
    <button class="dot-btn locked" data-page="2" title="Chapitre II (Verrouillé)" disabled>
      <span class="dot-num">II</span>
    </button>
    <span class="dot-line"></span>
    <button class="dot-btn locked" data-page="3" title="Chapitre III (Verrouillé)" disabled>
      <span class="dot-num">III</span>
    </button>
  </nav>

  <!-- =========================================================================
       PAGE 1 : GENÈSE (VISUEL PUR SANS TEXTE)
       ========================================================================= -->
  <section class="page-view active" id="page-1" data-page="1">
    <div class="visual-wrapper">
      <!-- Animated Visual (Video or Dynamic Ken Burns Image) -->
      <div class="visual-media ken-burns" style="background-image: url('images/genesis.jpg');"></div>
      <!-- Atmospheric Dynamic Canvas Layer -->
      <canvas class="fx-canvas" id="canvas-1"></canvas>
      <div class="vignette-overlay"></div>
    </div>

    <!-- Password Input Bar -->
    <div class="secret-gate">
      <form class="gate-box" id="form-gate-1" onsubmit="return false;">
        <span class="lock-glyph">🔒</span>
        <input 
          type="text" 
          id="pass-1" 
          class="gate-input" 
          placeholder="Mot de passe..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button type="submit" class="gate-btn" title="Déverrouiller">
          <span>➜</span>
        </button>
      </form>
      <div class="feedback-msg" id="feedback-1"></div>
    </div>
  </section>

  <!-- =========================================================================
       PAGE 2 : EXODE & LÉVITIQUE (VISUEL PUR SANS TEXTE)
       ========================================================================= -->
  <section class="page-view" id="page-2" data-page="2">
    <div class="visual-wrapper">
      <div class="visual-media ken-burns" style="background-image: url('images/exodus.jpg');"></div>
      <canvas class="fx-canvas" id="canvas-2"></canvas>
      <div class="vignette-overlay"></div>
    </div>

    <!-- Password Input Bar -->
    <div class="secret-gate">
      <form class="gate-box" id="form-gate-2" onsubmit="return false;">
        <span class="lock-glyph">🔒</span>
        <input 
          type="text" 
          id="pass-2" 
          class="gate-input" 
          placeholder="Mot de passe..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button type="submit" class="gate-btn" title="Déverrouiller">
          <span>➜</span>
        </button>
      </form>
      <div class="feedback-msg" id="feedback-2"></div>
    </div>
  </section>

  <!-- =========================================================================
       PAGE 3 : LE REPOS / LA TERRE PROMISE (VISUEL PUR)
       ========================================================================= -->
  <section class="page-view" id="page-3" data-page="3">
    <div class="visual-wrapper">
      <div class="visual-media ken-burns" style="background-image: url('images/rest.jpg');"></div>
      <canvas class="fx-canvas" id="canvas-3"></canvas>
      <div class="vignette-overlay"></div>
    </div>

    <!-- Replay / Completion Seal -->
    <div class="completion-gate">
      <button class="replay-btn" onclick="goToPage(1)" title="Recommencer depuis la Genèse">
        <span>⟲ Recommencer</span>
      </button>
    </div>
  </section>

  <!-- Fullscreen Divine Flash on Unlock -->
  <div class="flash-screen" id="flash-screen"></div>

  <script src="script.js"></script>
</body>
</html>
